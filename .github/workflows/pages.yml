name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Configure the public auth API origin
        env:
          AUTH_API_URL: ${{ vars.AUTH_API_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const origin = process.env.AUTH_API_URL;
          if (!origin) process.exit(0);
          if (!/^https:\/\/[a-z0-9-]+\.onrender\.com\/?$/.test(origin)) {
            throw new Error('AUTH_API_URL must be the Render HTTPS origin.');
          }
          // Patch every page (index.html, profile.html, ...), not just index.html.
          for (const name of fs.readdirSync('Frontend').filter(f => f.endsWith('.html'))) {
            const file = 'Frontend/' + name;
            const html = fs.readFileSync(file, 'utf8');
            fs.writeFileSync(file, html.replace(
              '<meta name="auth-api-origin" content="">',
              '<meta name="auth-api-origin" content="' + new URL(origin).origin + '">'
            ));
          }
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Frontend
      - uses: actions/deploy-pages@v4
        id: deployment
