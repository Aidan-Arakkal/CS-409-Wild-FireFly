<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wild FireFly Accounts</title>
    <script src="/auth.js" defer></script>
</head>
<body>
    <main>
        <h1>Wild FireFly Accounts</h1>
        <p id="status" role="status"></p>

        <div id="guest">
            <form id="register">
                <h2>Create an account</h2>
                <p><label>Name <input name="name" autocomplete="name" required maxlength="100"></label></p>
                <p><label>Email <input name="email" type="email" autocomplete="email" required maxlength="254"></label></p>
                <p><label>Password (15–128 characters) <input name="password" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label></p>
                <button>Create account</button>
            </form>

            <form id="login">
                <h2>Sign in</h2>
                <p><label>Email <input name="email" type="email" autocomplete="username" required maxlength="254"></label></p>
                <p><label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="128"></label></p>
                <button>Sign in</button>
            </form>
        </div>

        <button id="logout" hidden>Sign out</button>
    </main>
</body>
</html>
